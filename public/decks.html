<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header con Botones Desplazables</title>
    <link rel="stylesheet" href="decks_styles.css">
    <!-- La hoja de estilos externa decks_styles.css ya contiene
         display: flex para .button-container, por lo que el
         style tag de aquí se puede omitir. -->
</head>
<body>

    <header class="scrollable-header">
        <div id="header-buttons" class="button-container">
            <!-- Los botones del header se generan por JS -->
        </div>
    </header>

    <main>
        <section class="grid-container">
          <h2>Galería de botones</h2>
          <div id="grid-buttons" class="grid-buttons">
            <!-- Los botones de la cuadrícula se generan por JS -->
          </div>
        </section>
    </main>

    <script>
      // Configuración: cambia estos valores si quieres más/menos botones
      const HEADER_COUNT = 8;   // botones en el header
      const GRID_COUNT = 60;    // botones en la cuadricula

      // Mazos de ejemplo (del mock)
      const MOCK_DECKS = [
        {
          id: 1,
          nombre: "Equipo inicial",
          userId: 1,
          pokémonIds: [1, 4, 7, 25],
          estadísticas: {
            totalAtaque: 49 + 52 + 48 + 55,
            totalHp: 45 + 39 + 44 + 35
          }
        },
        {
          id: 2,
          nombre: "Equipo fuego",
          userId: 1,
          pokémonIds: [4, 4, 4, 25],
          estadísticas: {
            totalAtaque: 52 * 3 + 55,
            totalHp: 39 * 3 + 35
          }
        }
      ];

      // Pokémon de ejemplo
      const MOCK_POKEMON = [
        {
          id: 1,
          nombre: "bulbasaur",
          tipos: ["planta", "veneno"],
          sprite: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png",
          estadísticas: { hp: 45, ataque: 49, defensa: 49, velocidad: 45 }
        },
        {
          id: 4,
          nombre: "charmander",
          tipos: ["fuego"],
          sprite: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png",
          estadísticas: { hp: 39, ataque: 52, defensa: 43, velocidad: 65 }
        },
        {
          id: 7,
          nombre: "squirtle",
          tipos: ["agua"],
          sprite: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png",
          estadísticas: { hp: 44, ataque: 48, defensa: 65, velocidad: 43 }
        },
        {
          id: 25,
          nombre: "pikachu",
          tipos: ["eléctrico"],
          sprite: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png",
          estadísticas: { hp: 35, ataque: 55, defensa: 40, velocidad: 90 }
        }
      ];

      // Generar botones del header con los nombres de los mazos
      const headerContainer = document.getElementById('header-buttons');
      MOCK_DECKS.forEach((deck) => {
        const btn = document.createElement('button');
        btn.className = 'nav-button';
        btn.innerHTML = `<span style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span>${deck.nombre}</span></span>`;
        headerContainer.appendChild(btn);
      });

      // Medir el primer botón para que el botón "+" tenga las mismas dimensiones
      const firstButton = headerContainer.querySelector('.nav-button');
      let buttonWidth = 'auto';
      let buttonHeight = 'auto';
      if (firstButton) {
        const styles = window.getComputedStyle(firstButton);
        buttonWidth = styles.width;
        buttonHeight = styles.height;
      }

      // Crear y agregar el botón "+" al final
      const addButton = document.createElement('button');
      addButton.className = 'nav-button';
      addButton.innerHTML = `<span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 1.5rem;">+</span>`;
      Object.assign(addButton.style, {
        width: buttonWidth,
        height: buttonHeight,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center'
      });
      headerContainer.appendChild(addButton);

      // Generar botones de la cuadricula con Pokémon de ejemplo
      const gridContainer = document.getElementById('grid-buttons');
      MOCK_POKEMON.forEach((pokemon) => {
        const btn = document.createElement('button');
        btn.className = 'grid-button';
        btn.innerHTML = `<span style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; height: 100%; justify-content: center;"><img src="${pokemon.sprite}" style="width: 40px; height: 40px; image-rendering: pixelated;" alt="${pokemon.nombre}"><span style="font-size: 0.6em;">${pokemon.nombre}</span></span>`;
        gridContainer.appendChild(btn);
      });
    </script>

</body>
</html>
